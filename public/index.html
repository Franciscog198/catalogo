.incl{margin:0 0 4px;font-weight:700;color:var(--green)}
.empty{color:var(--muted);padding:18px 0}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>
<body>
<header>
  <h1 id="brand"><img class="logo" src="logo.png" alt="Smash Burger" width="640" height="615"></h1>

</header>

<footer id="foot"></footer>
<div id="bar"><button id="open"></button></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="cfg" role="dialog" aria-modal="true" aria-label="Elegí las opciones"><div class="panel" id="cfgp"></div></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido"><div class="panel">
  <div class="top"><h2>Tu pedido</h2><button class="x" id="close" aria-label="Cerrar">✕</button></div>
  <div id="lines"></div>
  <div id="sums"></div>
  <div id="sugs"></div>
  <label for="name">Tu nombre</label>
  <input id="name" autocomplete="name">
  <label>¿Cómo lo recibís?</label>
  <div class="seg"><button type="button" data-m="Retiro en el local" aria-pressed="true">Retiro en el local</button><button type="button" data-m="Envío a domicilio" aria-pressed="false">Envío a domicilio</button></div>
  <p class="hint" id="retiroBox"></p>

  <label for="pay">Forma de pago</label>

  <div class="payinfo" id="payInfo" hidden></div>

</div></div>

    { id: "agri", n: "Agri Burguer", d: "Pan a elección, medallón de roast beef, queso tybo, queso roquefort, cebolla caramelizada, huevo y salsa ByQ.", p: 15000, k: "b" },
    { id: "smash", n: "Smash Burguer", d: "Pan a elección, x2 medallón de roast beef, huevo, cheddar, panceta, champiñones, queso RQ, queso tybo y cebolla caramelizada.", p: 18000, k: "b" },
    { id: "american", n: "American Burguer", d: "Pan a elección, medallón de roast beef, lechuga, tomate, huevo, queso tybo, queso cheddar y bacon.", p: 15000, k: "b" },

  ]},

  ]},

    { id: "mlomoa", n: "Medio Lomito Americano", d: "Pan, bife, lechuga, tomate, huevo, jamón, queso tybo, cheddar y bacon.", p: 20000 }

  ]},
  { cat: "Al plato", incl: "Todos incluyen papas", items: [
    { id: "lomoplato", n: "Lomo al plato", d: "Con ensalada o fritas.", p: 26000, k: "p" },

const $ = n => "$" + n.toLocaleString("es-AR");
const ENVIO = "Envío a domicilio";
const byId = {}; MENU.forEach(c => c.items.forEach(i => byId[i.id] = i));
const cart = {}, last = {}; let mode = "Retiro en el local", cfg = null;
const q = s => document.querySelector(s);
const unit = l => byId[l.id].p == null ? null : byId[l.id].p + (l.med ? CONFIG.medallon : 0);
const pending = () => Object.values(cart).some(l => unit(l) == null);
const subtotal = () => Object.values(cart).reduce((a, l) => a + (unit(l) || 0) * l.qty, 0);
const delivery = () => mode === ENVIO ? CONFIG.envio : 0;
const money = () => pending() ? "A confirmar" : $(subtotal() + delivery());
const count = () => Object.values(cart).reduce((a, l) => a + l.qty, 0);
const label = l => { const x = [l.pan, l.acomp, l.med ? "con medallón extra" : ""].filter(Boolean); return byId[l.id].n + (x.length ? " (" + x.join(", ") + ")" : ""); };
q("#brand img").alt = CONFIG.nombre;
q('[data-m="' + ENVIO + '"]').textContent = ENVIO + " (+" + $(CONFIG.envio) + ")";

function ctl(key) {
  const l = cart[key];
  return l
    ? `<div class="qty"><button data-a="-" data-key="${key}" aria-label="Quitar uno">−</button><span>${l.qty}</span><button data-a="+" data-key="${key}" aria-label="Agregar uno">+</button></div>`
    : `<button class="add" data-a="+" data-key="${key}">Agregar</button>`;
}
function menuCtl(i) {
  if (!i.k) return ctl(i.id);
  const keys = Object.keys(cart).filter(k => cart[k].id === i.id);
  if (!keys.length) return `<button class="add" data-a="cfg" data-id="${i.id}">Agregar</button>`;
  const tot = keys.reduce((a, k) => a + cart[k].qty, 0), key = cart[last[i.id]] ? last[i.id] : keys[keys.length - 1];
  return `<div class="ctlwrap"><div class="qty"><button data-a="-" data-key="${key}" aria-label="Quitar uno">−</button><span>${tot}</span><button data-a="+" data-key="${key}" aria-label="Agregar uno">+</button></div><button type="button" class="more" data-a="cfg" data-id="${i.id}">Otras opciones</button></div>`;
}
let tt;
function toast() {
  const t = q("#toast"); t.textContent = "✓ Agregado al pedido"; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1400);
}
function toggleMed(k) {
  const l = cart[k]; if (!l) return;
  const nl = { ...l, med: !l.med }, nk = [nl.id, nl.pan, nl.acomp, nl.med ? 1 : 0].join("|");
  const ent = Object.entries(cart); Object.keys(cart).forEach(x => delete cart[x]);
  ent.forEach(([x, v]) => { const key = x === k ? nk : x, val = x === k ? nl : v; if (cart[key]) cart[key].qty += val.qty; else cart[key] = val; });
  last[nl.id] = nk; render();
}
function render() {
  q("#menu").innerHTML = MENU.map((c, n) => `<section id="c${n}"${c.promo ? ' class="promo"' : ""}><h2>${c.cat}</h2>${c.incl ? `<p class="incl">${c.incl}</p>` : ""}${c.items.map(i =>
    `<div class="item"><div class="row"><div class="ph${FOTOS[i.id] ? "" : " emo"}" aria-hidden="true">${FOTOS[i.id] ? `<img src="${FOTOS[i.id]}" alt="" loading="lazy" data-e="${IC[c.cat] || "🍽️"}" onerror="this.replaceWith(document.createTextNode(this.dataset.e))">` : (IC[c.cat] || "🍽️")}</div><div class="info"><h3>${i.n}${i.tag ? `<span class="tag">${i.tag}</span>` : ""}</h3>${i.d ? `<p>${i.d}</p>` : ""}<b>${i.p == null ? "Precio a confirmar" : $(i.p)}</b></div></div>${i.agotado ? `<button class="add" disabled>Agotado</button>` : menuCtl(i)}</div>`).join("")}</section>`).join("");
  q("#bar").classList.toggle("on", count() > 0);
  q("#open").innerHTML = `<span>Ver pedido (${count()})</span><span>${money()}</span>`;
  renderLines();
}
function renderLines() {
  const keys = Object.keys(cart);
  q("#lines").innerHTML = keys.length
    ? keys.map(k => { const l = cart[k], u = unit(l); return `<div class="line"><span>${label(l)}${u == null ? "" : `<br><small>${$(u * l.qty)}</small>`}${byId[l.id].k === "b" ? `<br><button type="button" class="opt" data-a="med" data-key="${k}" aria-pressed="${!!l.med}">${l.med ? "✓ Con medallón extra · Quitar" : "+ Medallón extra (" + $(CONFIG.medallon) + ")"}</button>` : ""}</span>${ctl(k)}</div>`; }).join("")
    : `<p class="empty">Todavía no agregaste nada. Sumá una hamburguesa del menú.</p>`;
  renderSugs();
  q("#sums").innerHTML = `<div class="sum"><span>Subtotal</span><span>${pending() ? "A confirmar" : $(subtotal())}</span></div>` +
    (delivery() ? `<div class="sum"><span>Envío</span><span>${$(delivery())}</span></div>` : "") +
    `<div class="total"><span>Total</span><span>${money()}</span></div>`;
}
function change(e) {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  if (b.dataset.a === "cfg") return openCfg(b.dataset.id);
  if (b.dataset.a === "med") return toggleMed(b.dataset.key);
  const k = b.dataset.key, l = cart[k] || (cart[k] = { id: k, qty: 0 }), add = b.dataset.a === "+";
  l.qty += add ? 1 : -1;
  if (l.qty <= 0) delete cart[k]; else last[l.id] = k;
  render();
  if (add && !q("#sheet").classList.contains("on")) toast();
  if (!count()) q("#sheet").classList.remove("on");
}
function openCfg(id) {
  const i = byId[id];
  cfg = { id, pan: i.k === "b" || i.k === "c" ? CONFIG.panes[0] : "", acomp: i.k === "p" ? "Ensalada" : "", med: false };
  renderCfg(); q("#cfg").classList.add("on");
}
function seg(g, opts, cur) {
  return `<div class="seg">${opts.map(([v, t]) => `<button type="button" data-g="${g}" data-v="${v}" aria-pressed="${cur === v}">${t}</button>`).join("")}</div>`;
}
function renderCfg() {
  const i = byId[cfg.id], u = unit(cfg);
  q("#cfgp").innerHTML = `<div class="top"><h2>${i.n}</h2><button class="x" data-g="close" aria-label="Cerrar">✕</button></div>` +
    (i.k !== "p" ? `<p class="cfgh">${i.k === "c" ? "Pan (para las 3 burguers)" : "Pan a elección"}</p>${seg("pan", CONFIG.panes.map(p => [p, p]), cfg.pan)}` : "") +
    (i.k === "b" ? `<p class="cfgh">Medallón extra</p>${seg("med", [["0", "Sin extra"], ["1", "Medallón extra +" + $(CONFIG.medallon)]], cfg.med ? "1" : "0")}` : "") +
    (i.k === "p" ? `<p class="cfgh">Acompañamiento</p>${seg("acomp", [["Ensalada", "Ensalada"], ["Fritas", "Fritas"]], cfg.acomp)}` : "") +
    `<button id="send" data-g="add">Agregar al pedido${u == null ? "" : " · " + $(u)}</button>`;
}
q("#cfg").addEventListener("click", e => {
  if (e.target.id === "cfg") return q("#cfg").classList.remove("on");
  const b = e.target.closest("button[data-g]"); if (!b) return;
  const g = b.dataset.g;
  if (g === "close") return q("#cfg").classList.remove("on");
  if (g === "add") {
    const k = [cfg.id, cfg.pan, cfg.acomp, cfg.med ? 1 : 0].join("|");
    (cart[k] = cart[k] || { ...cfg, qty: 0 }).qty++; last[cfg.id] = k;
    q("#cfg").classList.remove("on"); render(); return toast();
  }
  if (g === "med") cfg.med = b.dataset.v === "1"; else cfg[g] = b.dataset.v;
  renderCfg();
});
q("#menu").addEventListener("click", change);
q("#lines").addEventListener("click", change);
q("#open").onclick = () => q("#sheet").classList.add("on");
q("#close").onclick = () => q("#sheet").classList.remove("on");
q("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") q("#sheet").classList.remove("on"); });
document.querySelectorAll(".seg button[data-m]").forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll(".seg button[data-m]").forEach(x => x.setAttribute("aria-pressed", x === b));
  q("#addrBox").hidden = mode !== ENVIO;
  q("#retiroBox").hidden = mode === ENVIO;
  render();
});
q("#sendOrder").onclick = () => {
  const name = q("#name").value.trim(), addr = q("#addr").value.trim(), err = q("#err");
  if (!count()) { err.textContent = "Agregá al menos un producto."; return; }
  if (!name) { err.textContent = "Escribí tu nombre para que sepamos a quién entregarle."; q("#name").focus(); return; }
  if (mode === ENVIO && !addr) { err.textContent = "Escribí la dirección de entrega."; q("#addr").focus(); return; }
  err.textContent = "";
  try { localStorage.setItem("smash_cliente", JSON.stringify({ name, addr, pay: q("#pay").value, mode })); } catch (_) {}
  const lines = Object.values(cart).map(l => `${l.qty}x ${label(l)}${unit(l) == null ? "" : " - " + $(unit(l) * l.qty)}`).join("\n");
  const note = q("#note").value.trim();
  const msg = `*Nuevo pedido - ${CONFIG.nombre}*\n\n${lines}${delivery() ? `\nEnvío - ${$(delivery())}` : ""}\n\n*Total: ${pending() ? "a confirmar" : $(subtotal() + delivery())}*\n\nNombre: ${name}\nEntrega: ${mode}${mode === ENVIO ? "\nDirección: " + addr : ""}\nPago: ${q("#pay").value}${note ? "\nAclaraciones: " + note : ""}`;
  const a = document.createElement("a");
  a.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
};
// Sugerencias antes de enviar
const GRUPOS = [["papas", ["xpapas"], ["xpapas"]],
  ["bebida", ["cocav", "spritev", "coca15", "sprite15", "zero15"], ["coca15", "sprite15"]],
  ["postre", ["tiramisu", "chocotorta", "oreo", "chocooreo", "quaker"], ["chocotorta", "tiramisu"]]];
function renderSugs() {
  const ids = Object.values(cart).map(l => l.id);
  const sug = GRUPOS.filter(g => !g[1].some(x => ids.includes(x))).flatMap(g => g[2]).filter(id => byId[id]);
  q("#sugs").innerHTML = ids.length && sug.length
    ? `<p class="cfgh">¿Sumás algo más?</p><div class="chips">${sug.map(id => `<button type="button" class="chip" data-a="+" data-key="${id}">+ ${byId[id].n}${byId[id].p == null ? "" : " · " + $(byId[id].p)}</button>`).join("")}</div>` : "";
}
q("#sugs").addEventListener("click", change);

// Estado abierto / cerrado (hora de Argentina)
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
function estado(date) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: "America/Argentina/Buenos_Aires", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(date);
  const g = t => p.find(x => x.type === t).value;
  const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(g("weekday"));
  const mins = (+g("hour") % 24) * 60 + +g("minute"), hoy = CONFIG.dias.includes(wd);
  if (hoy && mins >= CONFIG.abre * 60) return { open: true, text: "Abierto ahora, hasta las 00:00" };
  const hora = CONFIG.abre + ":00";
  if (hoy) return { open: false, text: "Cerrado, abrimos hoy a las " + hora };
  for (let d = 1; d <= 7; d++) if (CONFIG.dias.includes((wd + d) % 7))
    return { open: false, text: "Cerrado, abrimos " + (d === 1 ? "mañana" : "el " + DIAS[(wd + d) % 7]) + " a las " + hora };
}
function showStatus() {
  const e = estado(new Date());
  q("#status").textContent = e.text; q("#dot").classList.toggle("off", !e.open);
  q("#closedNote").textContent = e.open ? "" : "Ahora estamos cerrados. Podés enviar el pedido y lo atendemos apenas abramos.";
}
showStatus(); setInterval(showStatus, 60000);

// Barra de categorías
const nav = q("#nav");
const construirNav = () => { nav.innerHTML = MENU.map((c, n) => `<a href="#c${n}">${c.cat}</a>`).join(""); activa = -1; };
let activa = -1, tick = false;
function marcar() {
  tick = false; let a = 0;
  MENU.forEach((c, n) => { const e = q("#c" + n); if (e && e.getBoundingClientRect().top <= 110) a = n; });
  if (a === activa) return; activa = a;
  [...nav.children].forEach((x, n) => x.classList.toggle("on", n === a));
  nav.scrollTo({ left: nav.children[a].offsetLeft - 16, behavior: "smooth" });
}
addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(marcar); } }, { passive: true });
construirNav(); marcar();

// Datos de transferencia
const info = q("#payInfo");
info.innerHTML = `Alias: <b>${CONFIG.alias}</b><button type="button" id="copyAlias">Copiar alias</button><br>Mercado Pago a nombre de ${CONFIG.titular}<br><small>Hacé la transferencia y mandanos el comprobante por WhatsApp.</small>`;
q("#pay").onchange = () => { info.hidden = q("#pay").value !== "Transferencia"; };
q("#copyAlias").onclick = async e => { try { await navigator.clipboard.writeText(CONFIG.alias); e.target.textContent = "¡Copiado!"; } catch (_) { e.target.textContent = CONFIG.alias; } };
// Ubicación
const mapa = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.direccion + ", Argentina");
q("#foot").innerHTML = `<p><b>${CONFIG.nombre}</b><br>${CONFIG.direccion}<br>Jueves a martes, de 19:00 a 00:00</p><a class="btn" href="${mapa}" target="_blank" rel="noopener">Cómo llegar</a><a class="btn" href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">Escribinos por WhatsApp</a>`;
q("#retiroBox").innerHTML = `Retirás en ${CONFIG.direccion}. <a href="${mapa}" target="_blank" rel="noopener">Cómo llegar</a>`;

// Datos guardados del cliente
try {
  const g = JSON.parse(localStorage.getItem("smash_cliente") || "null");
  if (g) {
    q("#name").value = g.name || ""; q("#addr").value = g.addr || "";
    if (g.pay) q("#pay").value = g.pay;
    q("#pay").onchange();
    if (g.mode === ENVIO) q('[data-m="' + ENVIO + '"]').click();
  }
} catch (_) {}
render();

// Carta desde Google Sheets (si falla, queda la carta incluida en este archivo)
function parseCSV(t) {
  const rows = []; let r = [], c = "", inq = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (inq) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else inq = false; } else c += ch; }
    else if (ch === '"') inq = true;
    else if (ch === ",") { r.push(c); c = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; r.push(c); rows.push(r); r = []; c = ""; }
    else c += ch;
  }
  if (c || r.length) { r.push(c); rows.push(r); }
  return rows;
}
function menuDesdeCSV(t) {
  const rows = parseCSV(t).filter(x => x.some(c => c.trim()));
  const h = rows.shift().map(x => x.trim().toLowerCase()), cats = [], vistos = {};
  rows.forEach(x => {
    const g = n => (x[h.indexOf(n)] || "").trim(), cat = g("categoria"), nom = g("nombre");
    if (!cat || !nom) return;
    if (!vistos[cat]) { vistos[cat] = { cat, promo: cat.toLowerCase().startsWith("promo"), incl: "", items: [] }; cats.push(vistos[cat]); }
    if (!vistos[cat].incl) vistos[cat].incl = g("aviso");
    const pr = g("precio").replace(/\D/g, "");
    vistos[cat].items.push({
      id: g("id") || nom.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, ""),
      n: nom, d: g("descripcion"), p: pr ? +pr : null,
      k: { hamburguesa: "b", combo: "c", plato: "p" }[g("tipo").toLowerCase()] || "",
      agotado: /^(si|sí|x)$/i.test(g("agotado")), tag: g("etiqueta"), foto: g("foto")
    });
  });
  return cats;
}
async function cargarHoja() {
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch("/.netlify/functions/menu", { signal: ctl.signal, cache: "no-store" }); clearTimeout(t);
    if (!r.ok) throw 0;
    const cats = await r.json(); if (!Array.isArray(cats) || !cats.length) throw 0;
    MENU.length = 0; MENU.push(...cats);
    Object.keys(byId).forEach(k => delete byId[k]);
    MENU.forEach(c => c.items.forEach(i => { byId[i.id] = i; if (i.foto) FOTOS[i.id] = i.foto; }));
    Object.keys(cart).forEach(k => { if (!byId[cart[k].id]) delete cart[k]; });
    construirNav(); marcar(); render();
  } catch (_) {}
}
cargarHoja();
